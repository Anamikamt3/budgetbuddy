<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income | BudgetBuddy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232d5bff'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f2b138'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-kind="income">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="page-head with-actions">
        <div>
          <h1 id="pageTitle">Expenses</h1>
          <p id="pageIntro">Track what you spend.</p>
        </div>
        <div class="head-actions">
          <button type="button" class="button" id="addBtn">+ Add expense</button>
        </div>
      </header>

      <div class="toolbar">
        <div class="field">
          <label for="monthFilter">Month</label>
          <input type="month" id="monthFilter">
        </div>
        <div class="field">
          <label for="optionFilter" id="optionFilterLabel">Category</label>
          <select id="optionFilter"></select>
        </div>
      </div>

      <div class="summary-line" id="summaryLine"></div>

      <div class="table-wrap">
        <table class="data" id="dataTable">
          <thead>
            <tr>
              <th>Date</th>
              <th id="optionHeader">Category</th>
              <th>Description</th>
              <th class="num">Amount</th>
              <th><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="listBody"></tbody>
        </table>
        <div class="empty" id="emptyBox" hidden></div>
      </div>
    </main>
  </div>

  <dialog id="formDialog" aria-labelledby="dialogTitle">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 id="dialogTitle">Add expense</h2>
        <button type="button" class="icon-close" id="closeBtn" aria-label="Close">&times;</button>
      </div>

      <form id="txForm" novalidate>
        <div class="alert" id="formAlert" role="alert" hidden></div>

        <div class="field-row">
          <div class="field">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00">
            <p class="field-error" id="amount-error"></p>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date">
            <p class="field-error" id="date-error"></p>
          </div>
        </div>

        <div class="field">
          <label for="option" id="optionLabel">Category</label>
          <select id="option" name="option"></select>
          <button type="button" class="inline-link" id="addOptionBtn">+ New category</button>
          <p class="field-error" id="option-error"></p>
        </div>

        <div class="field">
          <label for="description">Note (optional)</label>
          <input type="text" id="description" name="description" maxlength="200" placeholder="e.g. Lunch with friends">
          <p class="field-error" id="description-error"></p>
        </div>

        <button type="submit" class="btn" id="saveBtn"><span class="btn-label">Save expense</span></button>
      </form>
    </div>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
