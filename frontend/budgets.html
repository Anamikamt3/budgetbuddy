<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgets | BudgetBuddy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232d5bff'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f2b138'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="page-head with-actions">
        <div>
          <h1>Budgets</h1>
          <p>Set a monthly limit and watch it fill up as you spend.</p>
        </div>
        <div class="head-actions">
          <div class="field" style="margin:0">
            <label class="sr-only" for="month">Month</label>
            <input type="month" id="month" aria-label="Month">
          </div>
          <button type="button" class="button" id="addBtn">+ Set budget</button>
        </div>
      </header>

      <section class="budget-hero" id="hero" aria-label="Overall budget"></section>

      <section class="panel" style="margin-top:20px">
        <div class="panel-head">
          <h2>Category budgets</h2>
        </div>
        <div id="categoryList"></div>
      </section>
    </main>
  </div>

  <dialog id="formDialog" aria-labelledby="dialogTitle">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 id="dialogTitle">Set budget</h2>
        <button type="button" class="icon-close" id="closeBtn" aria-label="Close">&times;</button>
      </div>

      <form id="budgetForm" novalidate>
        <div class="alert" id="formAlert" role="alert" hidden></div>

        <div class="field">
          <label for="category">Applies to</label>
          <select id="category" name="category"></select>
          <p class="hint">Choose "Overall" for your total monthly limit.</p>
          <p class="field-error" id="category-error"></p>
        </div>

        <div class="field">
          <label for="amount">Monthly limit</label>
          <input type="number" id="amount" name="amount" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00">
          <p class="field-error" id="amount-error"></p>
        </div>

        <button type="submit" class="btn" id="saveBtn"><span class="btn-label">Save budget</span></button>
      </form>
    </div>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/budgets.js"></script>
</body>
</html>
