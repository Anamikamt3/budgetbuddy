<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview | BudgetBuddy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232d5bff'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f2b138'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="page-head with-actions">
        <div>
          <h1 id="greeting">Welcome</h1>
          <p>Here is how your money looks this month.</p>
        </div>
        <div class="head-actions">
          <div class="field" style="margin:0">
            <label class="sr-only" for="month">Month</label>
            <input type="month" id="month" aria-label="Month">
          </div>
          <a class="button" href="expenses.html?new=1">+ Add expense</a>
          <a class="button secondary" href="income.html?new=1">+ Add income</a>
        </div>
      </header>

      <section class="stats" aria-label="Month summary">
        <div class="stat">
          <div class="label">Income</div>
          <div class="value" id="statIncome">--</div>
          <div class="sub">Money received</div>
        </div>
        <div class="stat">
          <div class="label">Expenses</div>
          <div class="value" id="statExpenses">--</div>
          <div class="sub">Money spent</div>
        </div>
        <div class="stat">
          <div class="label">Balance</div>
          <div class="value" id="statBalance">--</div>
          <div class="sub">Income minus expenses</div>
        </div>
        <div class="stat">
          <div class="label">Budget used</div>
          <div class="value" id="statBudget">--</div>
          <div id="statBudgetExtra"></div>
        </div>
      </section>

      <section class="grid-2">
        <div class="panel">
          <div class="panel-head">
            <h2>Spending by category</h2>
          </div>
          <div id="categories"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Recent transactions</h2>
            <a href="expenses.html">View expenses</a>
          </div>
          <div id="recent"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
